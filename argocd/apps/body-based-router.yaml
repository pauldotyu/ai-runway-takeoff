apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: body-based-router
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    name: body-based-router
    repoURL: registry.k8s.io/gateway-api-inference-extension/charts
    chart: body-based-routing
    targetRevision: v1.5.0
    helm:
      releaseName: body-based-router
      namespace: istio-system
      valuesObject:
        provider:
          name: istio
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
